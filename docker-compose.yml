# ad_policy (avatar lookup) behind the proxy (TLS, auth, Mattermost routing).
# Configure with ./setup.sh, start with `docker compose up -d --build`,
# verify with ./setup.sh check. See INSTALL.md.
services:
  ad_policy:
    build: .
    image: ad_policy:latest
    container_name: ad_policy
    restart: unless-stopped
    # Reachable only from the proxy on the compose network; not published.
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      LOG_FILE: /app/logs/pexavatar.log
      # Used only when LDAP_VALIDATE_CERT=true and the file exists.
      LDAP_CA_CERT: /certs/ad-ca.pem
    volumes:
      - ./logs:/app/logs
      - ./certs:/certs:ro

  proxy:
    build: ./proxy
    image: ad_policy_proxy:latest
    container_name: ad_policy_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Only the proxy's own settings; it never sees the LDAP credentials.
    environment:
      MATTERMOST_POLICY_URL: ${MATTERMOST_POLICY_URL:-}
      POLICY_USER: ${POLICY_USER:-}
      POLICY_PASSWORD: ${POLICY_PASSWORD:-}
      TLS_MODE: ${TLS_MODE:-self-signed}
      PROXY_HOSTNAME: ${PROXY_HOSTNAME:-}
      AVATAR_UPSTREAM_URL: http://ad_policy:5000
    volumes:
      # Writable so TLS_MODE=self-signed can store the generated certificate.
      - ./certs/proxy:/etc/nginx/certs
    depends_on:
      - ad_policy
