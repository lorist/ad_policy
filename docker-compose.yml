services:
  ad_policy:
    build: .
    image: ad_policy:latest
    container_name: ad_policy
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - LOG_FILE=/app/logs/pexavatar.log
    volumes:
      - ./logs:/app/logs

  # Optional front door that lets ONE Pexip policy profile serve both the
  # Mattermost plugin (service configuration) and ad_policy (avatars).
  # Start with:  docker compose --profile proxy up -d --build
  # See proxy/README.md.
  proxy:
    profiles: ["proxy"]
    build: ./proxy
    image: ad_policy_proxy:latest
    container_name: ad_policy_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      # Base URL of the Mattermost plugin's policy API, e.g.
      # https://mattermost.example.com/plugins/com.pexip.pexip-app/api/
      # The proxy logs a warning at startup if this is unset.
      MATTERMOST_POLICY_URL: ${MATTERMOST_POLICY_URL:-}
      # Where avatar requests go. Default: the ad_policy container above.
      AVATAR_UPSTREAM_URL: ${AVATAR_UPSTREAM_URL:-http://ad_policy:5000}
    volumes:
      - ./proxy/certs:/etc/nginx/certs:ro
    depends_on:
      - ad_policy
