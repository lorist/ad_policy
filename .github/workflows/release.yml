# Builds both container images when a GitHub release is published and pushes
# them to the GitHub container registry, so customers can `docker compose pull`
# instead of building. Images:
#   ghcr.io/<owner>/ad_policy:<tag>        and :latest
#   ghcr.io/<owner>/ad_policy_proxy:<tag>  and :latest
# The <tag> is the release tag without its leading "v" (v1.0.0 -> 1.0.0).
# Packages are private until made public once in the package settings.
name: Release images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ad_policy
            context: .
          - image: ad_policy_proxy
            context: proxy
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Work out the version
        id: v
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ steps.v.outputs.tag }}
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/${{ matrix.image }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.owner }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
